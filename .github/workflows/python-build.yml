
name: Build Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: pypi
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
  trigger-deploy:
    needs: build
    uses: ./.github/workflows/python-publish.yml
    with:
      environment: 'pypi'
